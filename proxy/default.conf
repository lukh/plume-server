server {
    listen 80;
    server_name svn.plume-server.localhost;
    return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name svn.plume-server.localhost;

#   ssl_certificate /etc/nginx/conf.d/HOSTNAME+1.pem;
#   ssl_certificate_key /etc/nginx/conf.d/HOSTNAME+1-key.pem;
  ssl_certificate /etc/nginx/conf.d/cert.pem;
  ssl_certificate_key /etc/nginx/conf.d/key.pem;

   # SVN
   location / {
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Destination $http_destination;
        proxy_set_header Depth $http_depth;

        proxy_pass http://svn-server:80;

        client_max_body_size 0;

        proxy_request_buffering off;
        proxy_buffering off;
   }
}

server {
  listen 443 ssl;
  server_name inventree.plume-server.localhost;

#   ssl_certificate /etc/nginx/conf.d/HOSTNAME+1.pem;
#   ssl_certificate_key /etc/nginx/conf.d/HOSTNAME+1-key.pem;
  ssl_certificate /etc/nginx/conf.d/cert.pem;
  ssl_certificate_key /etc/nginx/conf.d/key.pem;

   # Inventree
   location / {
        proxy_set_header      Host              $http_host;
        proxy_set_header      X-Forwarded-By    $server_addr:$server_port;
        proxy_set_header      X-Forwarded-For   $remote_addr;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      CLIENT_IP         $remote_addr;

        proxy_pass_request_headers on;

        proxy_redirect off;

        client_max_body_size 100M;

        proxy_buffering off;
        proxy_request_buffering off;

        # Do not touch this unless you have a specific reason - this and the docker-compose need to match
        proxy_pass http://inventree-server:8000;
    }

    # Redirect any requests for static files
    location /static/ {
        alias /var/www/static/;
        autoindex on;

        # Caching settings
        expires 30d;
        add_header Pragma public;
        add_header Cache-Control "public";
    }

    # Redirect any requests for media files
    location /media/ {
        alias /var/www/media/;

        # Media files require user authentication
        auth_request /auth;

        # Content header to force download
        add_header Content-disposition "attachment";
    }

    # Use the 'user' API endpoint for auth
    location /auth {
        internal;

        proxy_pass http://inventree-server:8000/auth/;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

}